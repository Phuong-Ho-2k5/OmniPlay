name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: omniplay_test
          POSTGRES_USER: omniplay_test
          POSTGRES_PASSWORD: test_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniplay_test -d omniplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/omniplay_test
      TEST_DATABASE_USERNAME: omniplay_test
      TEST_DATABASE_PASSWORD: test_fixture_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        run: sh ./mvnw -B clean verify
