spring:
  application:
    name: omniplay-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

omniplay:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    issuer: omniplay-backend
    audience: omniplay-mobile

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
